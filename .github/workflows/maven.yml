name: Run tests

on:
  push

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v3
        with:
          repository: 'bondarenkokate73/simbirsoft_sdet_project'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker
        run: |
          # Установка зависимостей
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release
          
          # Добавление официального репозитория Docker
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          
          # Установка Docker
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          
          # Проверка установки
          sudo docker version
          sudo docker compose version

      - name: Build and run Docker containers
        run: |
          docker compose up --build -d
          
          # Ожидание готовности API через внешний curl (с хоста)
          echo "Waiting for API to become healthy..."
          for i in {1..10}; do
          if curl -sSf http://localhost:8080/getAll >/dev/null; then
          echo "API is ready!"
          break
          else
          echo "Attempt $i/10 - API not ready yet..."
          sleep 5
          fi
          done
          
          # Если после 10 попыток сервис не готов - выводим логи
          if ! curl -sSf http://localhost:8080/health >/dev/null; then
          echo "Service failed to start. Logs:"
          docker compose logs service
          exit 1
          fi

      - name: "Использование ветки main репозитория"
        uses: actions/checkout@v3
      - name: "Запуск тестов"
        run: mvn clean test
        continue-on-error: true
      - name: "Генерация allure-report"
        uses: simple-elf/allure-report-action@master
        id: allure-report
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: target/allure-report
          allure_history: target/allure-history

      - name: "Создание ветки gh-pages содержащей allure report"
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: target/allure-history